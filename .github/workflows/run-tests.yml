name: Automation Tests CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Permissions needed for GITHUB_TOKEN to publish to GitHub Pages and save artifacts
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    name: Run Selenium Tests (Headless)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Tests (Headless Chrome)
        run: |
          if [ -d "automation-exercise-framework" ]; then
            cd automation-exercise-framework
          fi
          mvn clean test -Dheadless=true

      - name: Upload Test Reports and Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-exercise-test-reports
          path: |
            **/reports/extent/
            **/reports/screenshots/
          retention-days: 14

      - name: Prepare Pages Artifact
        if: always()
        run: |
          mkdir -p public
          if [ -f "automation-exercise-framework/reports/extent/extent-report.html" ]; then
            cp -r automation-exercise-framework/reports/extent/* public/
            mkdir -p public/screenshots
            cp -r automation-exercise-framework/reports/screenshots/* public/screenshots/ 2>/dev/null || true
          elif [ -f "reports/extent/extent-report.html" ]; then
            cp -r reports/extent/* public/
            mkdir -p public/screenshots
            cp -r reports/screenshots/* public/screenshots/ 2>/dev/null || true
          fi
          # Ensure an index.html exists for GitHub Pages
          if [ -f "public/extent-report.html" ] && [ ! -f "public/index.html" ]; then
            cp public/extent-report.html public/index.html
          fi

      - name: Upload GitHub Pages Artifact
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy-report:
    name: Deploy Extent Report to GitHub Pages
    if: always() && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
